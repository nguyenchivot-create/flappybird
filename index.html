<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Bird</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- Mute toggle -->
    <div class="audio-controls">
      <button id="btn-audio-settings" title="Volume" aria-label="Volume settings">🎚️</button>
      <button id="btn-mute" title="Toggle sound (M)" aria-label="Toggle sound">🔊</button>
    </div>
    <div id="audio-panel" class="audio-panel hidden">
      <label>Music
        <input type="range" id="music-volume" min="0" max="100" step="1">
      </label>
      <label>Effects
        <input type="range" id="sfx-volume" min="0" max="100" step="1">
      </label>
    </div>

    <!-- Score HUD -->
    <div id="score-hud" class="hidden">
      <span id="score-display">0</span>
    </div>

    <!-- Menu Screen -->
    <div id="menu-screen" class="overlay">
      <div class="panel">
        <h1>Flappy Bird</h1>
        <p class="subtitle">Press Space or Tap to Start</p>
        <p class="subtitle hint">Press M to toggle sound</p>
        <div class="best-score">Best: <span id="menu-best">0</span></div>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="overlay hidden">
      <div class="panel">
        <h2>Game Over</h2>
        <div class="score-summary">
          <div class="score-row">
            <span>Score</span>
            <span id="final-score">0</span>
          </div>
          <div class="score-row">
            <span>Best</span>
            <span id="best-score">0</span>
          </div>
          <div class="score-row medal-row hidden" id="rank-row">
            <span>Leaderboard</span>
            <span id="rank-value"></span>
          </div>
          <div class="score-row medal-row hidden" id="medal-row">
            <span>Medal</span>
            <span id="medal-emoji"></span>
          </div>
        </div>
        <div class="btn-group">
          <button id="btn-restart" class="btn btn-primary">Restart</button>
          <button id="btn-leaderboard" class="btn btn-secondary">Leaderboard</button>
        </div>
      </div>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboard-screen" class="overlay hidden">
      <div class="panel leaderboard-panel">
        <h2>Leaderboard</h2>
        <div class="leaderboard-scroll">
          <table id="leaderboard-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Score</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
          </table>
        </div>
        <div class="btn-group">
          <button id="btn-close-leaderboard" class="btn btn-primary">Close</button>
          <button id="btn-clear-leaderboard" class="btn btn-danger">Clear All</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/bird.js"></script>
  <script src="js/pipe.js"></script>
  <script src="js/ground.js"></script>
  <script src="js/input.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
